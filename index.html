  const docIndex = new Map();
  const norm = value => String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
  const docNorm = value => String(value||"").replace(/[^0-9]/g, "");
  const escapeGroup = value => ({doc:value.doc, name:value.name, diplomas:[value.diploma]});
  DATA.forEach(person => {

    if (!found) docIndex.set(person.doc,escapeGroup(person));

  const PEOPLE=[...docIndex.values()];

  root.innerHTML=`
  <style>

  .stripe { height:8px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); }

  .kicker:before { content:""; width:32px; height:5px; border-radius:8px; background:var(--azul); flex:0 0 32px; }
  .title { font-size:clamp(30px,3.7vw,45px); line-height:1.1; font-weight:900;
    letter-spacing:-.025em; margin:0 0 14px; color:var(--tinta); }

    align-items:end; margin:0; }

  .btn.secondary { background:#eaf4f9; color:#183b50; border:1px solid #c9e1ef; }
  .linkbtn.rectify { color:#fff; background:#c90017; }
  .help,.note,.verify-note { font-size:18px; line-height:1.5; font-weight:650; color:#475569; margin:17px 0 0; }
  .note { margin-top:15px; }
  .rectify-inline { margin-top:20px; padding-top:18px; border-top:1px solid var(--borde);
    font-size:18px; font-weight:650; color:#425466; }
  .rectify-inline a,.mail { font-weight:850; color:#006b9d;

  .status.bad { color:#8b1c20; background:#ffebeb; border:1px solid #f6b9bf; }
  .person-name { margin:0 0 18px; font-size:clamp(24px,3vw,32px); line-height:1.2; font-weight:900; color:var(--tinta); }
  .doc-label { margin:0 0 18px; color:#425466; font-weight:750; font-size:18px; }
  .diploma-list { display:grid; gap:13px; margin:0; }
  .diploma-item { padding:19px; background:#f8fbfd; border:1px solid #cde4ef; border-radius:14px; min-width:0; }
  .diploma-item small { color:#527387; font-weight:900; text-transform:uppercase; letter-spacing:.055em; font-size:14px; display:block; margin-bottom:7px; }
  .diploma-item strong { display:block; color:var(--tinta); font-weight:850; font-size:21px; line-height:1.3; overflow-wrap:anywhere; }
  .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:21px; }
  .warning { border-left:5px solid var(--amarillo); background:#fff7e4; color:#574209;
    padding:16px 18px; border-radius:11px; font-size:18px; font-weight:650; margin:18px 0 0; }
  .notfound h3,.matches h3 { font-size:clamp(24px,3vw,30px); line-height:1.2; margin:0 0 14px; font-weight:900; }
  .notfound p,.matches p { margin:0 0 13px; font-size:19px; line-height:1.5; color:#425466; font-weight:600; }
  .match-list { display:grid; gap:11px; margin-top:16px; }

  .match-item strong { display:block; font-weight:850; font-size:19px; line-height:1.3; }

  .match-item .btn { min-height:48px; padding:11px 16px; font-size:17px; }
  @media (max-width:760px) {

    .btn,.linkbtn { width:100%; }
    .title { font-size:31px; }
    .subtitle { font-size:19px; }
    .person-name { font-size:24px; }
    .diploma-item strong { font-size:20px; }

  @media (prefers-reduced-motion:reduce) { .btn,.linkbtn {transition:none} }
</style>
  <section class="pdm-widget" aria-label="Consulta institucional de certificables">
    <div class="panel">
      <div class="stripe" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="body">
        <div class="card">
          <p class="kicker">Consulta institucional</p>
          <h2 class="title">Consulta de certificables</h2>
          <p class="subtitle">Ingrese su nombre o número de cédula para consultar si se encuentra habilitado para certificación en alguno de los diplomados.</p>
          <form class="form">
            <div class="input-wrap">
              <label class="label" for="pdm-certificables-query">Nombre completo o número de cédula</label>
              <input class="query" id="pdm-certificables-query" type="text" autocomplete="off" placeholder="Escriba su nombre o cédula" required>
            </div>
            <button class="btn primary" type="submit">Consultar</button>
          </form>
          <p class="help">Para una consulta más precisa, utilice su número de cédula. También puede buscar por nombre, sin importar tildes o mayúsculas.</p>
          <p class="rectify-inline">Si necesita corregir su nombre o identificación, <a class="rectify-link" href="${RECTIFY_URL}" target="_blank" rel="noopener noreferrer">solicite aquí la rectificación de sus datos</a>.</p>
          <p class="note">Esta consulta es informativa y no reemplaza el certificado oficial expedido por la entidad.</p>
        </div>
        <div class="output" role="status" aria-live="polite"></div>
      </div>
    </div>
  </section>`;

  const form = root.querySelector(".form");
  const queryInput = root.querySelector(".query");
  const output = root.querySelector(".output");
  const elem = (tag, className, content) => {
    const el=document.createElement(tag);
    if(className) el.className=className;
    if(content!==undefined) el.textContent=content;
    return el;
  };
  function reset() { queryInput.value=""; output.replaceChildren(); queryInput.focus(); }
  function scroll(el) { try {el.scrollIntoView({behavior:"smooth",block:"nearest"});} catch(_) {} }
  function buttonBar(card) {
    const actions=elem("div","actions");
    const a=elem("a","linkbtn rectify","Rectificar datos");
    a.href=RECTIFY_URL; a.target="_blank"; a.rel="noopener noreferrer";
    const again=elem("button","btn secondary","Nueva consulta");
    again.type="button"; again.addEventListener("click",reset);
    actions.append(a,again); card.append(actions);
  }
  function renderResult(person) {
    output.replaceChildren();
    const card=elem("article","result");
    card.append(elem("div","status ok","Certificable"),elem("h3","person-name",person.name));
    card.append(elem("p","doc-label","Cédula: "+person.doc));
    const list=elem("div","diploma-list");
    person.diplomas.forEach(diploma=>{
      const item=elem("div","diploma-item");
      item.append(elem("small",null,"Diplomado"),elem("strong",null,diploma));
      list.append(item);
    });
    card.append(list);
    card.append(elem("p","verify-note","Verifique que su nombre y número de cédula estén escritos correctamente. Si encuentra algún error, utilice la opción de rectificación de datos."));
    buttonBar(card); output.append(card); scroll(card);
  }
  function renderNotFound() {
    output.replaceChildren();
    const card=elem("article","notfound");
    card.append(elem("div","status bad","No está habilitado"));
    card.append(elem("h3",null,"No se encontró un registro habilitado para certificación"));
    card.append(elem("p",null,"Revise que su nombre o número de cédula estén escritos correctamente."));
    const p=elem("p");
    p.append(document.createTextNode("Si tiene preguntas sobre el resultado, escriba a "));
    const mail=elem("a","mail",CONTACT_EMAIL);
    mail.href="mailto:"+CONTACT_EMAIL;
    p.append(mail,document.createTextNode("."));
    card.append(p);
    card.append(elem("div","warning","Si necesita rectificar su nombre o identificación, diligencie el formulario de rectificación de datos."));
    buttonBar(card); output.append(card); scroll(card);
  }
  function renderMatches(people) {
    output.replaceChildren();
    const card=elem("article","matches");
    card.append(elem("h3",null,"Se encontraron varias coincidencias"));
    card.append(elem("p",null,"Seleccione su registro para consultar los diplomados en los que aparece como certificable."));
    const list=elem("div","match-list");
    people.slice(0,12).forEach(person=>{
      const item=elem("div","match-item"), info=elem("div");
      info.append(elem("strong",null,person.name),elem("small",null,"Cédula terminada en "+person.doc.slice(-4)));
      const btn=elem("button","btn secondary","Ver resultado");
      btn.type="button"; btn.addEventListener("click",()=>renderResult(person));
      item.append(info,btn); list.append(item);
    });
    card.append(list);
    if (people.length>12) card.append(elem("p","verify-note","Hay más coincidencias. Escriba un nombre más completo o consulte directamente con su cédula."));
    output.append(card); scroll(card);
  }
  function search(q) {
    const trimmed=String(q||"").trim();
    // Spaces, dots or hyphens are accepted as document separators.
    if (/^[\d\s.\-]+$/.test(trimmed)) {
      const exact=docIndex.get(docNorm(trimmed));
      return exact?[exact]:[];
    }
    const searchName=norm(trimmed);
    if (!searchName) return [];
    const exact=PEOPLE.filter(p=>norm(p.name)===searchName);
    if (exact.length) return exact;
    if(searchName.length<3) return [];
    return PEOPLE.filter(p=>norm(p.name).includes(searchName));
  }
  form.addEventListener("submit", function(e) {
    e.preventDefault(); const q=queryInput.value.trim();
    if (!q) {queryInput.focus(); return;}
    const matches=search(q);
    if (matches.length===1) renderResult(matches[0]);
    else if (matches.length>1) renderMatches(matches);
    else renderNotFound();
  });
})();
